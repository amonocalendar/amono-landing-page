<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f1">
  <title>You're on the list — Amono</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ivory:#f7f6f1;--forest:#18392c;--ink:#1c2b23;--body:#405347;--lime:#d9ed83;--font-display:Manrope,sans-serif;--font-body:"DM Sans",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;background:var(--ivory);color:var(--ink);font-family:var(--font-body);display:grid;place-items:center;padding:28px}
    main{width:min(620px,100%);text-align:center;padding:clamp(28px,6vw,64px);border:1px solid #e2e5dc;border-radius:22px;background:#fffefa}
    img{width:min(170px,45vw);height:auto;display:block;margin:0 auto 36px}
    .eyebrow{font-size:11px;letter-spacing:.16em;font-weight:700;color:#71856f;text-transform:uppercase}
    h1{font-family:var(--font-display);font-size:clamp(36px,7vw,58px);line-height:1.08;letter-spacing:-.06em;color:var(--forest);margin:14px 0 18px}
    p{font-size:16px;line-height:1.7;color:var(--body);margin:0 auto 30px;max-width:470px}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;border-radius:10px;background:var(--forest);color:#fffefa;text-decoration:none;font-weight:600}
    a:hover{background:#11271e}
  </style>
</head>
<body>
  <main>
    <a href="../index.html" aria-label="Amono home" style="display:block;background:none;padding:0;min-height:0"><img src="../amono-logo.png" alt="Amono"></a>
    <div class="eyebrow">Amono waitlist</div>
    <h1>You're on the list.</h1>
    <p>Thanks for helping shape Amono. We'll be in touch with project updates and early-access news.</p>
    <a href="../index.html">Back to Amono</a>
  </main>
</body>
</html>
